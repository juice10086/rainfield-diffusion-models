name: ${hydra:runtime.choices.sampler}


parameters_real_cmls:
    # --- sampling
    n_steps: 50
    sigma_min: 2e-3
    sigma_max: 80.0
    rho: 7.0
    eta: 1.0
    # --- gibbs
    n_reps: 1
    n_denoising_steps: 5
    lr: 3e-2
    n_gradient_steps: 10
    tau_sampling: "uniform"
    min_tau: 2e-3
    # --- debugging
    display_im: False



