defaults:
  - sampler: daps

device: cpu
seed: 12
# 12
# 35
# 26

prior:
  characteristic_length: 0.55
  # where the gp is evaluated and on how many points
  xlim: [-5.0, 5.0]
  n_samples: 50 


# inverse problem 
std_obs: 0.1
intervals: [
  [-4.0, -2.5],
  [-0.5, 1.0],
  [3.5, 4.5],
]
n_reconstructions: 1000

save_dir: .
